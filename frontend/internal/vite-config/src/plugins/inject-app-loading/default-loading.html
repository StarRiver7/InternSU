<style data-app-loading="inject-css">
  html {
    line-height: 1.15;
  }

  .loading {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }

  .loading.hidden {
    visibility: hidden;
    pointer-events: none;
    opacity: 0;
    transition: all 0.8s ease-out;
  }

  .title {
    margin-top: 24px;
    font-size: 24px;
    font-weight: 600;
    color: #000000;
  }

  .loader {
    position: relative;
    width: 40px;
    height: 40px;
    background-color: #000000;
    animation: morph 2s ease-in-out infinite;
  }

  @keyframes morph {
    0% {
      border-radius: 6%;
      transform: rotate(0deg);
    }
    50% {
      border-radius: 50%;
      transform: rotate(180deg);
    }
    100% {
      border-radius: 6%;
      transform: rotate(360deg);
    }
  }
</style>
<div class="loading" id="__app-loading__">
  <div class="loader"></div>
  <div class="title">%VITE_APP_TITLE%</div>
</div>
